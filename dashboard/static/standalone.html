<!DOCTYPE html>
<!--
  Chemistry by Design — route viewer (standalone).
  Generated by dashboard/build_static.py — open this file directly in a browser;
  no server or install needed. Everything (data, RDKit.js, Cytoscape) is inline.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chemistry by Design — Viewer</title>

  <script>
  // ===================== CONFIG — safe to edit by hand =====================
  // repo:   GitHub "owner/name" used by the "Open issue" / "Suggest a fix (PR)" links
  // branch: branch the PR link edits        email: address for "Email" ("" hides it)
  // dataPath: folder of the route JSON files inside the repo
  window.DASH_CONFIG = /*__CONFIG__*/;
  // ==========================================================================
  </script>

  <style>
/*__CSS__*/

/* ---- standalone-only additions ---- */
#loading {
  position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 10px;
  background: var(--bg); color: var(--text); font-size: 14px;
}
#loading .spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading.error .spinner { display: none; }
.report-box { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 8px; background: #fff7ec; }
.report-box textarea { width: 100%; min-height: 70px; margin: 6px 0 8px; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: 13px; resize: vertical; }
.report-box textarea:focus { outline: none; border-color: var(--accent); }
.report-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.report-actions a { text-decoration: none; }
.report-actions a.btn:not(.btn-primary) { color: var(--text); }
.report-ctx { font-size: 12px; color: var(--muted); word-break: break-all; }
#btn-report { border-color: var(--accent); color: var(--accent-dark); }
.about { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 6px; }
.about a { color: #fff; }
  </style>

  <!-- Vendored libs (load order matters: dagre -> cytoscape -> cytoscape-dagre) -->
  <!--__VENDOR__-->
  <!--__RDKIT_JS__-->
</head>
<body>
  <div id="loading"><div class="spinner"></div><div id="loading-msg">Loading chemistry engine…</div></div>

  <div id="app">
    <!-- Left: route list -->
    <aside id="sidebar">
      <div class="sidebar-head">
        <h1>Routes</h1>
        <input id="route-bgname" type="text" placeholder="Search compound name…" autocomplete="off" />
        <input id="route-doi" type="text" placeholder="Search DOI (e.g. 10.1002/anie…)" autocomplete="off" />
        <input id="route-author" type="text" placeholder="Search author…" autocomplete="off" />
        <input id="route-year" type="text" inputmode="numeric" placeholder="Search year (e.g. 2019)" autocomplete="off" />
        <div id="route-count" class="muted"></div>
        <div id="about" class="about"></div>
      </div>
      <ul id="route-list"></ul>
    </aside>

    <div class="gutter" id="gutter-l" data-side="left" title="drag to resize"></div>

    <!-- Middle: graph -->
    <main id="main">
      <header id="route-header">
        <div id="route-title">Select a route to begin</div>
        <div id="route-meta" class="muted"></div>
        <div id="route-tools" class="hidden">
          <button id="btn-abbr" class="btn" title="Toggle group / chain abbreviations (Bn, Boc, PEG6, (CH₂)ₙ …)">Abbrev: on</button>
          <button id="btn-color" class="btn" title="Toggle element colours for heteroatoms (O red, N blue, …) vs all-black">Colored atoms: off</button>
          <button id="btn-info" class="btn">Route info</button>
          <button id="btn-report" class="btn" title="Found an error in this route? Tell us by e-mail, GitHub issue, or a pull request">Report a mistake</button>
        </div>
        <div id="warnings" class="warnings hidden"></div>
      </header>
      <div id="graph-wrap">
        <div id="cy"></div>
      </div>
    </main>

    <div class="gutter" id="gutter-r" data-side="right" title="drag to resize"></div>

    <!-- Right: detail panel (read-only) -->
    <aside id="panel" class="empty">
      <div id="panel-empty" class="muted panel-pad">
        Click a <b>reaction node</b> to view its mapped reaction &amp; reagents,
        or a molecule to inspect it.
      </div>
      <div id="panel-content" class="hidden"></div>
    </aside>
  </div>

  <div id="tooltip" class="hidden"></div>

  <!-- click-to-enlarge lightbox for the reaction/molecule image -->
  <div id="lightbox" class="hidden">
    <img id="lightbox-img" alt="enlarged" />
  </div>

  <!-- Data: route index (plain JSON) + one gzipped, base64'd JSON per route. -->
  <script id="route-index" type="application/json">__INDEX__</script>
  <script id="route-data" type="application/json">__ROUTES__</script>
  <script id="rdkit-wasm" type="application/octet-stream">__RDKIT_WASM__</script>

  <script>
/*__APP_JS__*/
  </script>
</body>
</html>
